server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: kb-gateway
  main:
    web-application-type: reactive
  config:
    import: optional:nacos:kb-gateway-dev.yaml
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: nacos
        password: ${KB_GATEWAY_PASSWORD}
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: ${KB_GATEWAY_PASSWORD}
        ip: 127.0.0.1
        metadata:
          developer: ${COMPUTER_ID:${USER:unknown}}
    # Gateway配置
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # HTTP超时配置
      httpclient:
        connect-timeout: 3000
        response-timeout: 120s
        pool:
          max-connections: 500
          max-idle-time: 30s
          max-life-time: 60s
          acquire-timeout: 120000

      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # 路由配置
      routes:
        # 用户认证服务路由
        - id: kb-user-auth
          uri: lb://kb-user-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        # 文档服务路由
        - id: kb-document
          uri: lb://kb-document
          predicates:
            - Path=/api/document/**
          filters:
            - StripPrefix=2

        # 文件服务路由
        - id: kb-file
          uri: lb://kb-file
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=2

        # AI服务路由
        - id: kb-ai
          uri: lb://kb-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=2

        # 知识图谱服务路由
        - id: kb-graph
          uri: lb://kb-graph
          predicates:
            - Path=/api/graph/**
          filters:
            - StripPrefix=2

        # 搜索服务路由
        - id: kb-search
          uri: lb://kb-search
          predicates:
            - Path=/api/search/**
          filters:
            - StripPrefix=2

        # 统计分析服务路由
        - id: kb-statistics
          uri: lb://kb-statistics
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=2

        # 基础服务路由（通知、配置、日志、字典）
        - id: kb-foundation
          uri: lb://kb-foundation
          predicates:
            - Path=/api/notifications/**, /api/config/**, /api/logs/**, /api/dicts/**
          filters:
            - StripPrefix=1

        # 基础服务 - 接口文档专用路由
        # 说明：kb-foundation 的业务路由使用 StripPrefix=1，而 API 文档（/doc.html、
        # /v3/api-docs 等）位于服务根路径，无法通过业务路由访问，故单独提供 /api/foundation/**
        # 前缀（StripPrefix=2）用于访问其 Swagger 文档。
        - id: kb-foundation-doc
          uri: lb://kb-foundation
          predicates:
            - Path=/api/foundation/doc.html, /api/foundation/v3/api-docs/**, /api/foundation/swagger-resources/**, /api/foundation/webjars/**, /api/foundation/swagger-ui/**, /api/foundation/favicon.ico, /api/foundation/img/**
          filters:
            - StripPrefix=2

        # WebSocket 路由（直连 kb-foundation 的 STOMP 端点）
        - id: kb-foundation-ws
          uri: lb:ws://kb-foundation
          predicates:
            - Path=/ws/**

  # Redis配置（用于网关限流和缓存）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${KB_GATEWAY_PASSWORD}
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s

# 日志配置
logging:
  level:
    root: INFO
    com.knowledge.base: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 网关配置
gateway:
  # 白名单（不需要认证的路径）
  white-list:
    - /api/auth/auth/login
    - /api/auth/auth/register
    - /api/auth/auth/refresh
    - /api/document/share/**
    - /api/files/**
    # ⚠️ /api/ai/** 已移出白名单：
    # AI 接口（对话/RAG/KAG）必须登录后调用，否则网关不会下发 X-User-Id，
    # 下游 UserContextUtil.getUserIdFromHeader 会退化成默认用户 1，
    # 导致匿名请求以"管理员"身份检索，文档级权限过滤被架空（越权读取私有文档）。
    # 若确有免登录的 AI 接口，请按具体路径单独加回，不要放行整个 /api/ai/**。
    - /api/config/public
    - /api/notifications/templates
    - /ws/**
    - /doc.html
    - /swagger-resources
    - /v3/api-docs

# ==================== 限流配置 ====================
# 网关层按「客户端 IP」做粗粒度兜底限流（Redis + Lua 滑动窗口）。
# 各业务服务内部的 @RateLimit 注解负责按用户/业务语义的细粒度限流，两者互补。
kb:
  rate-limit:
    gateway:
      enabled: true
      # Redis 不可用时是否放行：true=保可用性（默认），false=保安全
      fail-open: true
      # 是否信任 X-Forwarded-For：默认 false（网关即入口，取 TCP 对端地址，不可伪造）。
      # 仅当前面还有一层可控的 Nginx/SLB 时才改为 true，届时取 XFF 的最后一段。
      trust-forwarded-for: false
      # 未命中任何规则时的兜底限额（0=不限制；生产可按需开启，例如 3000/60s）
      default-count: 0
      default-time: 60
      rules:
        # 登录：同一 IP 每分钟最多 20 次（业务服务内另有更严格的 10 次上限）
        # 注意：外部路径要多一层——网关 StripPrefix=2 去掉 /api/auth，
        # 而 kb-user-auth 的控制器本身是 @RequestMapping("/auth")，故实际路径为
        # /api/auth/auth/login（前端 auth.service.ts 亦然）。
        - paths:
            - /api/auth/auth/login
            - /api/auth/login
          count: 20
          time: 60
          message: 登录尝试过于频繁，请 1 分钟后再试
        # 注册 / 找回密码
        - paths:
            - /api/auth/auth/register
            - /api/auth/auth/password/**
            - /api/auth/register
            - /api/auth/password/**
          count: 10
          time: 300
          message: 操作过于频繁，请 5 分钟后再试
        # AI 相关接口（真实成本控制由业务服务按用户维度负责）
        - paths:
            - /api/ai/**
          count: 120
          time: 60
          message: AI 请求过于频繁，请稍后再试
        # 文件 / 文档上传
        # 同理：实际路径为 /api/file/files/upload、/api/document/documents/upload
        - paths:
            - /api/file/files/upload
            - /api/file/files/upload/**
            - /api/document/documents/upload
            - /api/document/documents/upload/**
            - /api/file/upload
            - /api/file/upload/**
            - /api/document/upload
            - /api/document/upload/**
          count: 60
          time: 60
          message: 上传过于频繁，请稍后再试
