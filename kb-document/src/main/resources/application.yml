server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: kb-document

  # Nacos 服务注册与发现
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: nacos
        password: ${KB_DOCUMENT_PASSWORD}
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: ${KB_DOCUMENT_PASSWORD}
        ip: 127.0.0.1
  config:
    import: optional:nacos:kb-document-dev.yaml

  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kb_document?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${KB_DOCUMENT_PASSWORD}
    druid:
      initial-size: 20
      min-idle: 10
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: CHANGE_ME_LOCAL_SECRET_012345678901234567890123456789
        login-password: ${KB_DOCUMENT_LOGIN_PASSWORD}



  # Servlet配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      # 批量导入一次可能上传多个文件（或一个 zip 包），请求体上限相应放大
      max-request-size: 200MB
      # 超过 2MB 的文件写入磁盘临时目录，避免 OOM
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}/kb-document-multipart

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # Elasticsearch配置
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 10s
    socket-timeout: 30s

  data:
    # Redis配置
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${KB_DOCUMENT_PASSWORD}
      database: 2
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s
    mongodb:
      host: 127.0.0.1
      port: 27017
      auto-index-creation: true
      database: knowledge_base
      username: mongodb
      password: ${KB_DOCUMENT_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 1800000

  # RabbitMQ配置（发布统计事件）
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: CHANGE_ME_LOCAL_SECRET_012345678901234567890123456789
    password: ${KB_DOCUMENT_PASSWORD}
    virtual-host: /

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.document.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.knowledge.base: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 文件存储配置
file:
  upload:
    path: ./uploads
    allowed-types:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - md
    max-size: 20971520
  # rustfs文件服务器配置
  server:
    rustfs:
      enabled: false
      base-url: http://localhost:8080
      upload-path: /api/upload
      access-prefix: /files
      auth-token:
      connect-timeout: 5000
      read-timeout: 30000
      max-file-size: 20971520

# kb-file 文件服务直连地址（本地开发时使用，留空则通过 Nacos 服务发现）
kb-file:
  url: http://localhost:8084

# kb-ai 服务直连地址（本地开发时使用）
kb-ai:
  url: http://localhost:8086

# kb-user-auth 用户服务直连地址（获取用户头像等信息）
kb-user-auth:
  url: http://localhost:8081

# JWT安全配置
security:
  jwt:
    exclude-paths: >
      /document/public/**,
      /public/**,
      /actuator/**,
      /doc.html,
      /swagger-resources/**,
      /v3/api-docs/**,
      /webjars/**,
      /favicon.ico

# Swagger配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
        loggerLevel: basic
      kb-file:
        connectTimeout: 10000
        readTimeout: 600000
        loggerLevel: basic
  circuitbreaker:
    enabled: false

# MinerU 文档解析服务（可选）
# ------------------------------------------------------------
# MinerU 是独立的 Python 服务，负责把扫描件 / 复杂版面 PDF 转成 Markdown。
# 未启用（enabled=false）或调用失败时，解析自动回退 Java 原生 PDFBox / POI。
# 启用方式：把 enabled 改为 true，并把 base-url 指向 MinerU 服务地址。
mineru:
  enabled: false
  base-url: http://127.0.0.1:8000
  # 解析接口（multipart 上传文件）
  parse-path: /v1/parse
  # 异步任务查询接口前缀（响应返回 taskId 时轮询 {task-path}/{taskId}）
  task-path: /v1/tasks
  # 解析超时（秒）——扫描件很慢，默认 10 分钟
  timeout-seconds: 600
  # 同时调用 MinerU 的最大并发
  max-concurrency: 2
  # 异步任务轮询间隔（毫秒）
  poll-interval-ms: 3000
  # 文本层探测：前 probe-pages 页平均有效字符数低于该值，判定为扫描件，交给 MinerU
  min-text-chars-per-page: 80
  probe-pages: 3
  # 超过该大小（MB）的文件不交给 MinerU
  max-file-size-mb: 100
  # true = 所有 PDF 都走 MinerU（不判断文本层，适合版面要求高的场景）
  force-for-pdf: false
